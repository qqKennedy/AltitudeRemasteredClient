name: Idea or request
description: Something you'd like the client to do or show.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        This client changes how the game looks and runs, not how it plays: no changes to gameplay, physics,
        networking or anything that would give an advantage over stock players.
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: What problem does it solve, and how would it look in game?
    validations:
      required: true
